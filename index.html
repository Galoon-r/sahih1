<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAHIH – contoh webnya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<style>
:root{--bg:#F1F3F7;--card:#fff;--ink:#16213E;--mute:#5A6379;--line:#D3D9E4;--ok:#1B7A4E;--part:#9A6200;--miss:#B0303F;--man:#3B58A0;--brand:#16213E;--onbrand:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1424;--card:#172038;--ink:#E7EBF4;--mute:#9BA6BF;--line:#2A3555;--ok:#5CC98F;--part:#E5A93D;--miss:#F08594;--man:#8FA8E8;--brand:#E7EBF4;--onbrand:#0E1424}}
:root[data-theme="dark"]{--bg:#0E1424;--card:#172038;--ink:#E7EBF4;--mute:#9BA6BF;--line:#2A3555;--ok:#5CC98F;--part:#E5A93D;--miss:#F08594;--man:#8FA8E8;--brand:#E7EBF4;--onbrand:#0E1424}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 'Instrument Sans',system-ui,sans-serif}
h1,h2,h3,.ref,.logo{font-family:'Source Serif 4',Georgia,serif}
h1{font-size:clamp(2rem,5vw,3.1rem);line-height:1.1;margin:0 0 16px;font-weight:700}
h2{font-size:1.6rem;margin:0 0 8px}h3{margin:0 0 6px;font-size:1.15rem}
.wrap{max-width:980px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:8px;height:58px}
.logo{font-weight:700;font-size:1.35rem;letter-spacing:.04em;margin-right:auto;cursor:pointer;background:none;border:0;color:var(--ink);display:flex;align-items:center;gap:8px}
.tab{background:none;border:0;color:var(--mute);font:500 14px inherit;padding:8px;cursor:pointer}
.tab:hover{color:var(--ink)}
.chip{font-size:13px;border:1px solid var(--line);border-radius:99px;padding:4px 12px;background:none;color:var(--ink);cursor:pointer}
.btn{background:var(--brand);color:var(--onbrand);border:1.5px solid var(--brand);border-radius:8px;padding:11px 20px;font:600 15px 'Instrument Sans',sans-serif;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,textarea:focus-visible,.logo:focus-visible{outline:3px solid var(--man);outline-offset:2px}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:36px;align-items:center;padding:56px 0 40px}
.hero p.lead{font-size:1.1rem;color:var(--mute);max-width:46ch;margin:0 0 24px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.st-ok{--c:var(--ok)}.st-part{--c:var(--part)}.st-miss{--c:var(--miss)}.st-man{--c:var(--man)}
.stamp{display:inline-block;color:var(--c);border:2px solid var(--c);outline:1px solid var(--c);outline-offset:2px;border-radius:5px;padding:1px 10px;font-weight:700;font-size:13px;transform:rotate(-2deg);white-space:nowrap}
.entry{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:10px;padding:16px 18px;margin-bottom:12px}
.entry .eh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.no{color:var(--mute);font-size:13px}
.ref{margin:0 0 8px;font-size:1.02rem;line-height:1.5}
.note{margin:0 0 10px;color:var(--mute);font-size:14px}
.src{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.src a{color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:2px 10px;text-decoration:none}
.src a:hover{background:color-mix(in srgb,var(--c) 14%,transparent)}
.tilt{transform:rotate(1.5deg)}.tilt2{transform:rotate(-1.5deg);margin-left:24px}
.legend,.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:18px 0 48px}
.lg{padding:14px 16px;border-radius:10px;background:color-mix(in srgb,var(--c) 10%,var(--card));border:1px solid color-mix(in srgb,var(--c) 30%,var(--line))}
.lg p{margin:10px 0 0;font-size:14px;color:var(--mute)}
.plan{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:6px}
.plan.hot{border:2px solid var(--brand)}
.price{font:700 1.7rem 'Source Serif 4',serif}
.plan ul{margin:6px 0 14px;padding-left:18px;color:var(--mute);font-size:14px;flex:1}
.page{padding:36px 0 60px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
textarea{width:100%;min-height:280px;border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--bg);color:var(--ink);font:400 15px/1.55 'Source Serif 4',Georgia,serif;resize:vertical}
.warn{color:var(--part);font-size:14px}
.bars{display:grid;gap:14px;margin:24px 0}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 20px}
.sum button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;font:500 14px 'Instrument Sans',sans-serif;cursor:pointer}
.sum button[aria-pressed="true"]{border-color:var(--ink)}
.sum b{font-size:1.2rem;color:var(--c,var(--ink));margin-right:6px}
.cta{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center;margin-top:24px}
.sheet{--ok:#1B7A4E;--part:#9A6200;--miss:#B0303F;--man:#3B58A0;background:#fff;color:#16213E;border:1px solid var(--line);border-radius:6px;padding:28px;max-width:820px;margin:0 auto}
.sheet h2{margin:0}.sheet .sm{color:#5A6379;font-size:13px}
.tbl{overflow-x:auto}.tbl table{border-collapse:collapse;width:100%;min-width:620px;font-size:13px;margin-top:14px}
.tbl th,.tbl td{border-bottom:1px solid #D3D9E4;padding:8px 6px;text-align:left;vertical-align:top}
.sheet .stamp{transform:none;outline:0;font-size:12px}
.modal{position:fixed;inset:0;background:rgba(10,15,30,.6);display:grid;place-items:center;padding:20px;z-index:20}
.md{background:var(--card);border-radius:14px;padding:24px;max-width:440px;width:100%;max-height:90%;overflow:auto}
.opt{display:flex;justify-content:space-between;width:100%;text-align:left;border:1.5px solid var(--line);background:none;color:var(--ink);border-radius:10px;padding:12px 14px;margin-top:10px;font:500 15px 'Instrument Sans',sans-serif;cursor:pointer}
.opt:hover{border-color:var(--ink)}
.qr{display:grid;grid-template-columns:repeat(13,1fr);width:170px;aspect-ratio:1;background:#fff;padding:8px;margin:14px auto;border:1px solid var(--line)}
.qr i{background:#fff}.qr i.b{background:#111}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--brand);color:var(--onbrand);padding:10px 18px;border-radius:8px;font-size:14px;z-index:30}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header><div class="wrap">
<button class="logo" data-a="go" data-v="home"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="13" cy="13" r="10.5"/><circle cx="13" cy="13" r="7" stroke-width="1"/><path d="M8.5 13.5l3 3 6-7" stroke-width="2.4"/></svg>SAHIH</button>
<button class="tab" data-a="go" data-v="check">Periksa referensi</button>
<button class="tab" data-a="price">Harga</button>
<button class="chip" id="plan" data-a="price"></button>
</div></header>
<main id="app" class="wrap"></main>
<div id="mod"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const S={ok:{t:'Terverifikasi',d:'Ada di pangkalan data dan semua informasinya cocok.'},part:{t:'Cocok sebagian',d:'Ditemukan, tetapi ada informasi yang berbeda dari sumber.'},miss:{t:'Tidak ditemukan',d:'Tidak ada hasil di keempat pangkalan data.'},man:{t:'Perlu diperiksa manual',d:'Belum bisa dipastikan otomatis. Cek langsung ke sumbernya.'}};
const PL={free:['Coba Gratis','Rp0',10],once:['Sekali Pakai','Rp10.000',60],sub:['Langganan Mahasiswa','Rp20.000',999]};
const GEN={ok:'Judul, penulis, dan tahun cocok dengan data sumber.',part:'Judul cocok, tetapi tahun atau halaman berbeda dari data sumber.',miss:'Tidak ada hasil untuk judul dan penulis ini di keempat pangkalan data.',man:'Ada kandidat mirip, tetapi belum bisa dipastikan. Periksa langsung di situs jurnal.'};
const SRC={ok:['Crossref','OpenAlex'],part:['OpenAlex'],miss:[],man:['Garuda']};
const DOI1='https://doi.org/10.1038/s41598-023-41032-5',G2='https://garuda.kemdiktisaintek.go.id/documents/detail/5596835';
const SAMPLE=[
{t:'Walters, W. H., & Wilder, E. I. (2023). Fabrication and errors in the bibliographic citations generated by ChatGPT. Scientific Reports, 13(1), 14045. https://doi.org/10.1038/s41598-023-41032-5',s:'ok',n:'Judul, penulis, tahun, volume, dan DOI cocok dengan data sumber. Klik Crossref untuk membuka artikelnya.',src:[['Crossref',DOI1]]},
{t:'Hartwell, J. M., & Okonkwo, P. R. (2022). Automated detection of hallucinated citations in undergraduate research writing. Journal of Academic Integrity Technology, 14(3), 201–219. https://doi.org/10.1016/j.jait.2022.03.014',s:'miss',n:'DOI tidak dapat ditelusuri dan judul tidak ditemukan di pangkalan data mana pun. Kemungkinan referensi karangan AI.',src:[]},
{t:'Yasmine, Y. S., & Hikmawan, R. (2025). ChatGPT sebagai Alat Bantu dalam Penulisan Karya Ilmiah Mahasiswa: Analisis Keterlibatan dan Kreativitas. Edumatic: Jurnal Pendidikan Informatika, 9(1), 99–108. https://doi.org/10.29408/edumatic.v9i1.29496',s:'ok',n:'Judul, penulis, tahun, dan halaman cocok dengan data Garuda. Klik Garuda untuk membuka artikelnya.',src:[['Garuda',G2]]},
{t:'Santoso, B. W., & Rahmawati, E. (2023). Efektivitas verifikasi otomatis daftar pustaka terhadap kualitas karya tulis ilmiah mahasiswa. Jurnal Literasi Akademik Nusantara, 8(2), 112–127.',s:'miss',n:'Tanpa DOI. Judul dan penulis tidak ditemukan di Garuda maupun SINTA.',src:[]},
{t:'Lindqvist, A. K. (2021). Citation integrity in the age of generative language models: A longitudinal study. Review of Scholarly Communication Studies, 9(4), 455–478. https://doi.org/10.1002/rscs.2021.0455',s:'miss',n:'DOI tidak terdaftar dan judul tidak ada di Crossref maupun OpenAlex.',src:[]}];
const st={v:'home',plan:'free',text:'',res:[],f:'all',modal:null,cut:false};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const parse=v=>(v.includes('\n\n')?v.split(/\n\s*\n/):v.split('\n')).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean);
function judge(t){const m=SAMPLE.find(x=>x.t===t);if(m)return m;let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))>>>0;const k=['ok','ok','part','miss','man'][h%5];return{t,s:k,n:GEN[k],src:SRC[k]}}
const cnt=k=>st.res.filter(r=>r.s===k).length;
const entry=(r,i)=>`<article class="entry st-${r.s}"><div class="eh"><span class="no">Referensi ${i+1}</span><span class="stamp">${S[r.s].t}</span></div><p class="ref">${esc(r.t)}</p><p class="note">${r.n}</p><div class="src">${r.src.length?'Sumber: '+r.src.map(x=>typeof x==='string'?`<a href="#" data-a="toast" data-m="Prototype: tautan ke ${x} belum aktif">${x}</a>`:`<a href="${x[1]}" target="_blank" rel="noopener">${x[0]}</a>`).join(''):'Tidak ada sumber yang cocok'}</div></article>`;
const V={
home:()=>`<section class="hero"><div><h1>Referensimu benar-benar ada?</h1><p class="lead">Tempel daftar pustaka. SAHIH menelusuri tiap entri di Crossref, OpenAlex, Garuda, dan SINTA, lalu menunjukkan mana yang sahih dan mana yang perlu kamu cek sendiri.</p><div class="row"><button class="btn" data-a="go" data-v="check">Periksa 10 referensi gratis</button><button class="btn ghost" data-a="demo">Lihat contoh hasil</button></div></div>
<div aria-hidden="true"><div class="tilt">${entry(SAMPLE[2],2)}</div><div class="tilt2">${entry(SAMPLE[3],3)}</div></div></section>
<h2>Empat status, tanpa tebak-tebakan</h2><p style="color:var(--mute);margin:0">Referensi yang belum pasti tidak langsung dianggap salah.</p>
<div class="legend">${Object.keys(S).map(k=>`<div class="lg st-${k}"><span class="stamp">${S[k].t}</span><p>${S[k].d}</p></div>`).join('')}</div>
<h2 id="harga">Harga untuk kantong mahasiswa</h2><p style="color:var(--mute);margin:0">Harga masih asumsi awal dan akan divalidasi.</p>
<div class="plans">
<div class="plan"><h3>Coba Gratis</h3><div class="price">Rp0</div><ul><li>10 entri per bulan</li><li>Tanpa laporan PDF</li></ul><button class="btn ghost" data-a="buy" data-p="free">Mulai gratis</button></div>
<div class="plan hot"><h3>Sekali Pakai</h3><div class="price">Rp10.000</div><ul><li>1 daftar pustaka, hingga 60 entri</li><li>Laporan Kesahihan Referensi (PDF)</li></ul><button class="btn" data-a="buy" data-p="once">Pilih Sekali Pakai</button></div>
<div class="plan"><h3>Langganan Mahasiswa</h3><div class="price">Rp20.000</div><ul><li>Pemeriksaan tanpa batas selama 1 bulan</li><li>Laporan PDF setiap pemeriksaan</li></ul><button class="btn ghost" data-a="buy" data-p="sub">Pilih Langganan</button></div></div>`,
check:()=>`<section class="page"><h2>Periksa daftar pustaka</h2><p style="color:var(--mute);margin:0 0 16px">Pisahkan tiap referensi dengan baris kosong atau baris baru.</p><div class="box"><textarea id="ta" placeholder="Tempel daftar pustaka di sini…" aria-label="Daftar pustaka">${esc(st.text)}</textarea><div class="row" style="justify-content:space-between;margin-top:12px"><span id="cnt"></span><div class="row"><button class="btn ghost" data-a="sample">Pakai contoh</button><button class="btn" data-a="run">Periksa referensi</button></div></div></div></section>`,
run:()=>`<section class="page"><h2>Sedang memeriksa…</h2><p id="pc" style="color:var(--mute);margin:0">Memulai</p><div class="bars">${['Crossref','OpenAlex','Garuda','SINTA'].map(d=>`<div><div class="row" style="justify-content:space-between;font-size:14px"><span>${d}</span></div><div class="bar"><i></i></div></div>`).join('')}</div></section>`,
res:()=>{const L=st.res.filter(r=>st.f==='all'||r.s===st.f);return`<section class="page"><h2>Hasil pemeriksaan</h2><p style="color:var(--mute);margin:0">${st.res.length} referensi diperiksa.</p>${st.cut?`<p class="warn">Paket ${PL[st.plan][0]} hanya memeriksa ${PL[st.plan][2]} entri pertama. Pilih paket lain untuk memeriksa lebih banyak.</p>`:''}
<div class="sum"><button data-a="f" data-k="all" aria-pressed="${st.f==='all'}">Semua ${st.res.length}</button>${Object.keys(S).map(k=>`<button class="st-${k}" data-a="f" data-k="${k}" aria-pressed="${st.f===k}"><b>${cnt(k)}</b>${S[k].t}</button>`).join('')}</div>
${L.map(r=>entry(r,st.res.indexOf(r))).join('')||'<p>Tidak ada referensi dengan status ini.</p>'}
<div class="box cta"><div><h3>Laporan Kesahihan Referensi</h3><span style="color:var(--mute);font-size:14px">PDF berisi status, keterangan, dan tautan sumber.</span></div><button class="btn" data-a="report">${st.plan==='free'?'Buka laporan PDF':'Lihat laporan PDF'}</button></div></section>`},
report:()=>`<section class="page"><div class="row" style="justify-content:space-between;margin-bottom:14px"><button class="btn ghost" data-a="go" data-v="res">Kembali ke hasil</button><button class="btn" data-a="toast" data-m="Prototype: unduhan PDF disimulasikan">Unduh PDF</button></div>
<div class="sheet"><h2>Laporan Kesahihan Referensi</h2><p class="sm">Dibuat oleh SAHIH · 24 September 2026 · ${st.res.length} referensi<br>${Object.keys(S).map(k=>`${S[k].t}: ${cnt(k)}`).join(' · ')}</p>
<div class="tbl"><table><tr><th>No</th><th>Referensi</th><th>Status</th><th>Keterangan dan sumber</th></tr>${st.res.map((r,i)=>`<tr class="st-${r.s}"><td>${i+1}</td><td>${esc(r.t.slice(0,90))}${r.t.length>90?'…':''}</td><td><span class="stamp">${S[r.s].t}</span></td><td>${r.n}<br><span class="sm">${r.src.join(', ')||'-'}</span></td></tr>`).join('')}</table></div></div></section>`
};
function modal(){const m=st.modal;if(!m)return'';if(m.step==='pick')return`<div class="modal"><div class="md"><h3>Laporan PDF ada di paket berbayar</h3><p style="color:var(--mute);margin:0">Pilih paket untuk mengunduh laporan.</p><button class="opt" data-a="buy" data-p="once"><span>Sekali Pakai</span><b>Rp10.000</b></button><button class="opt" data-a="buy" data-p="sub"><span>Langganan Mahasiswa</span><b>Rp20.000</b></button><button class="btn ghost" style="margin-top:14px;width:100%" data-a="close">Nanti saja</button></div></div>`;
let q='';for(let i=0;i<169;i++){const x=i%13,y=i/13|0;q+=`<i class="${(x<4&&y<4)||(x>8&&y<4)||(x<4&&y>8)||(x*7+y*11+x*y)%3===0?'b':''}"></i>`}
return`<div class="modal"><div class="md"><h3>Bayar ${PL[m.plan][0]}</h3><div class="price">${PL[m.plan][1]}</div><div class="qr">${q}</div><p style="color:var(--mute);font-size:14px;text-align:center;margin:0 0 14px">Pindai dengan QRIS atau dompet digital.</p><button class="btn" style="width:100%" data-a="paid">Simulasikan pembayaran berhasil</button><button class="btn ghost" style="margin-top:8px;width:100%" data-a="close">Batal</button></div></div>`}
function draw(){app.innerHTML=V[st.v]();$('#mod').innerHTML=modal();$('#plan').textContent='Paket: '+PL[st.plan][0];if(st.v==='check')upd()}
function upd(){const n=parse(st.text).length,l=PL[st.plan][2],e=$('#cnt');if(e)e.innerHTML=`${n} entri`+(n>l?` <span class="warn">· paket ini memeriksa ${l} entri pertama</span>`:'')}
function go(v){st.v=v;draw();scrollTo(0,0)}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2200)}
function run(){const e=parse(st.text);if(!e.length)return toast('Tempel minimal satu referensi dulu');const l=PL[st.plan][2];st.cut=e.length>l;st.res=e.slice(0,l).map(judge);st.f='all';go('run');const n=st.res.length;let k=0;const iv=setInterval(()=>{k++;const p=k/n;const pc=$('#pc');if(pc)pc.textContent=`Memeriksa referensi ${k} dari ${n}`;document.querySelectorAll('.bar i').forEach((b,i)=>b.style.width=Math.min(100,Math.max(0,p*130-i*10))+'%');if(k>=n){clearInterval(iv);setTimeout(()=>{if(st.v==='run')go('res')},500)}},Math.max(200,2400/n))}
const A={
go:d=>go(d.v),price:()=>{go('home');setTimeout(()=>$('#harga').scrollIntoView(),30)},
demo:()=>{st.text=SAMPLE.map(x=>x.t).join('\n\n');run()},
sample:()=>{st.text=SAMPLE.map(x=>x.t).join('\n\n');draw()},
run,f:d=>{st.f=d.k;draw()},
buy:d=>{if(d.p==='free'){st.plan='free';go('check')}else{st.modal={step:'qris',plan:d.p};draw()}},
report:()=>{if(st.plan==='free'){st.modal={step:'pick'};draw()}else go('report')},
paid:()=>{st.plan=st.modal.plan;st.modal=null;toast('Pembayaran berhasil (simulasi)');go(st.res.length?'report':'check')},
close:()=>{st.modal=null;draw()},toast:d=>toast(d.m)
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;e.preventDefault();A[t.dataset.a](t.dataset)});
document.addEventListener('input',e=>{if(e.target.id==='ta'){st.text=e.target.value;upd()}});
draw();
</script>
</body>
</html>
